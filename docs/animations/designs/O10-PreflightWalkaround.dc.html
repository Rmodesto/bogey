<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preflight walkaround, scenario player</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0e1114}a:hover{color:#000}

@keyframes bprop{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0.12)}}
.pblade{transform-box:fill-box;transform-origin:center;animation:bprop 0.5s linear infinite}
.pdisc{opacity:0;transition:opacity 0.25s ease}
.fly .pblade{animation-duration:0.1s}
.fly .pdisc{opacity:0.65}
@media (prefers-reduced-motion: reduce){.pblade{animation:none}}

</style>
</helmet>
<div style="width: 720px; height: 820px; box-sizing: border-box; padding: 24px; background: #f6f8fa; color: #0e1114; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Preflight walkaround</h1>
<span style="font-size: 13px; padding: 6px 12px; border-radius: 8px; background: #2b2f33; color: #a9cfe3; font-weight: 600">Operations</span>
</div>
<div style="width: 672px; height: 420px; box-sizing: border-box; padding: 14px; background: #FFFFFF; border: 1px solid #e3e6ea; border-radius: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 196px; flex-shrink: 0; border-radius: 10px; background: #e7f2f8; overflow: hidden">
<svg aria-hidden="true" width="642" height="196" viewBox="0 0 642 196" fill="none" style="position: absolute; left: 0; top: 0">
<rect x="0" y="166" width="642" height="30" fill="#e3e6ea"></rect><path d="M0 166h642" stroke="#0e1114" stroke-width="2"></path>
<svg x="196" y="52" width="250" height="113.6" viewBox="0 0 88 40" fill="none" class="" style="overflow: visible; "><rect x="42.5" y="3" width="3" height="6" fill="#0e1114"></rect><ellipse class="pdisc" cx="44" cy="2.6" rx="11" ry="2.6" fill="#9cd94a"></ellipse><rect class="pblade" x="33" y="1.3" width="22" height="2.6" rx="1.3" fill="#9cd94a" stroke="#0e1114" stroke-width="1.2"></rect><ellipse class="pdisc" cx="16" cy="6.5" rx="14" ry="2.6" fill="#9cd94a"></ellipse><rect class="pblade" x="2" y="5.2" width="28" height="2.6" rx="1.3" fill="#9cd94a" stroke="#0e1114" stroke-width="1.2"></rect><ellipse class="pdisc" cx="72" cy="6.5" rx="14" ry="2.6" fill="#9cd94a"></ellipse><rect class="pblade" x="58" y="5.2" width="28" height="2.6" rx="1.3" fill="#9cd94a" stroke="#0e1114" stroke-width="1.2"></rect><rect x="13" y="8" width="6" height="8" rx="2" fill="#0e1114"></rect><rect x="69" y="8" width="6" height="8" rx="2" fill="#0e1114"></rect><path d="M17 14L34 17M71 14L54 17" stroke="#2b2f33" stroke-width="4.5" stroke-linecap="round"></path><path d="M36 25L29 37M52 25L59 37M24 37.5h10M54 37.5h10" stroke="#0e1114" stroke-width="2.5" stroke-linecap="round" fill="none"></path><rect x="40.5" y="25" width="7" height="4" fill="#0e1114"></rect><circle cx="44" cy="32" r="4.5" fill="#2b2f33" stroke="#0e1114" stroke-width="1.5"></circle><circle cx="44" cy="32" r="1.7" fill="#a9cfe3"></circle><rect x="33" y="8" width="22" height="18" rx="4" fill="#a9cfe3" stroke="#0e1114" stroke-width="2"></rect><rect x="36.5" y="12" width="15" height="6" rx="2" fill="#0e1114"></rect><circle cx="50" cy="22" r="1.7" fill="#9cd94a"></circle></svg>
<circle cx="321" cy="72" r="6" fill="#9cd94a" stroke="#0e1114" stroke-width="1.5"></circle>
<g><rect x="52" y="96" width="84" height="48" rx="6" fill="#FFFFFF" stroke="#0e1114" stroke-width="2"></rect><rect x="136" y="110" width="7" height="20" fill="#0e1114"></rect><rect x="58" y="102" width="56" height="36" rx="3" fill="#9cd94a"></rect><text x="94" y="160" font-size="11" font-weight="600" fill="#0e1114" text-anchor="middle" style="">Battery</text></g>
<g><rect x="508" y="92" width="100" height="56" rx="10" fill="#FFFFFF" stroke="#0e1114" stroke-width="2"></rect><circle cx="532" cy="120" r="9" stroke="#0e1114" stroke-width="2"></circle><circle cx="584" cy="120" r="9" stroke="#0e1114" stroke-width="2"></circle><rect x="546" y="100" width="24" height="16" rx="2" fill="#a9cfe3" stroke="#0e1114" stroke-width="1.5"></rect><path d="M558 92V76" stroke="#0e1114" stroke-width="2.5" stroke-linecap="round"></path><text x="558" y="160" font-size="11" font-weight="600" fill="#0e1114" text-anchor="middle" style="">Controller</text></g>
<path d="M226 66l8 6" stroke="#b42318" stroke-width="2.5" stroke-linecap="round" style="opacity: {{oProp}}; transition: opacity 0.5s ease"></path>
<circle cx="242" cy="70" r="30" stroke="#b42318" stroke-width="3" stroke-dasharray="7 5" style="opacity: {{oProp}}; transition: opacity 0.5s ease"></circle><circle cx="94" cy="120" r="52" stroke="#b42318" stroke-width="3" stroke-dasharray="7 5" style="opacity: {{oBatt}}; transition: opacity 0.5s ease"></circle><circle cx="558" cy="116" r="62" stroke="#b42318" stroke-width="3" stroke-dasharray="7 5" style="opacity: {{oCtl}}; transition: opacity 0.5s ease"></circle><circle cx="321" cy="72" r="22" stroke="#b42318" stroke-width="3" stroke-dasharray="7 5" style="opacity: {{oLight}}; transition: opacity 0.5s ease"></circle><circle cx="321" cy="146" r="24" stroke="#b42318" stroke-width="3" stroke-dasharray="7 5" style="opacity: {{oCam}}; transition: opacity 0.5s ease"></circle>
</svg>
<div style="position: absolute; right: 12px; top: 40px; max-width: 250px; font-size: 12px; font-weight: 600; line-height: 1.35; padding: 4px 10px; border: 1.5px solid #0e1114; border-radius: 10px; background: #FFFFFF">{{tag}}</div>
<div style="position: absolute; left: 10px; top: 8px; max-width: 622px; font-size: 12.5px; font-weight: 600; background: #FFFFFF; padding: 2px 8px; border-radius: 6px">{{sceneLabel}}</div>
</div>
<div style="font-size: 15px; font-weight: 600; line-height: 1.3">{{question}}</div>
<div role="group" aria-label="Answers" style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; padding: 8px 12px; border-radius: 10px; cursor: pointer; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; line-height: 1.25; color: #0e1114; border: {{o.border}}; background: {{o.bg}}"><span>{{o.label}}</span><span style="font-size: 12px; color: {{o.markInk}}">{{o.mark}}</span></button>
</sc-for>
</div>
<div aria-live="polite" style="flex-grow: 1; display: flex; align-items: center; padding: 6px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 500; line-height: 1.4; border: {{fbBorder}}; color: {{fbInk}}; background: {{fbBg}}">{{feedback}}</div>
</div>
<p aria-live="polite" style="margin: 0; font-size: 15px; line-height: 1.4; min-height: 42px">{{caption}}</p>
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums">{{progress}}</span>
<button type="button" onClick="{{back}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; margin-left: auto; border: 2px solid #0e1114; background: #FFFFFF; color: #0e1114">Back</button>
<button type="button" onClick="{{nextOne}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; border: 2px solid #9cd94a; background: #9cd94a; color: #0e1114">{{nextLabel}}</button>
</div>
<div style="margin-top: auto; padding: 14px 16px; background: #0e1114; color: #ffffff; border-radius: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35">Before every flight, check that the aircraft, the battery, and the control station are in a condition for safe operation.</p>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #2b2f33; color: #a9cfe3; white-space: nowrap; font-variant-numeric: tabular-nums">Part 107 rules</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="48" height="52" viewBox="0 0 48 52" fill="none" style="flex-shrink: 0">
<path d="M5 52C5 45 13 41.5 24 41.5C35 41.5 43 45 43 52Z" fill="#a9cfe3"></path>
<path d="M19 41.5L24 47L29 41.5" stroke="#6fa6c6" stroke-width="1.5" stroke-linejoin="round"></path>
<rect x="29" y="45.5" width="9" height="4.5" rx="1.5" fill="#9cd94a"></rect>
<rect x="20" y="33" width="8" height="9" fill="#dcbf98"></rect>
<path d="M12 14Q12 6 24 6Q36 6 36 14L36 26Q36 31 31.5 34.5L27.5 37.5Q24 39.5 20.5 37.5L16.5 34.5Q12 31 12 26Z" fill="#f0d6b4"></path>
<path d="M10.5 17Q9.5 3 24 3Q38.5 3 37.5 17L35 13.5Q24 9.5 13 13.5Z" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8" stroke-linejoin="round"></path>
<rect x="7" y="15" width="5.5" height="11.5" rx="2" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8"></rect>
<rect x="35.5" y="15" width="5.5" height="11.5" rx="2" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8"></rect>
<path d="M12.5 16L35.5 16L34.5 23Q30 25.8 26 22.6L24 21.6L22 22.6Q18 25.8 13.5 23Z" fill="#6fa6c6" stroke="#2b2f33" stroke-width="0.8" stroke-linejoin="round"></path>
<path d="M15 18L21.5 18" stroke="#e7f2f8" stroke-width="1.1" stroke-linecap="round"></path>
<path d="M27.5 19.5h5" stroke="#9cd94a" stroke-width="1.1" stroke-linecap="round"></path>
<path d="M20.5 30.5Q24 32.6 27.5 30.5" stroke="#2b2f33" stroke-width="1.4" stroke-linecap="round"></path>
<path d="M9.5 26Q10.5 33.5 18.5 34" stroke="#8a9198" stroke-width="1.5" stroke-linecap="round"></path>
<circle cx="19.5" cy="34" r="1.7" fill="#9cd94a"></circle>
</svg>
<p style="margin: 0; padding: 8px 12px; background: #eaf6d8; border: 2px solid #9cd94a; border-radius: 13px; color: #2b2f33; font-size: 13px; line-height: 1.5">The controller gets a preflight too.</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":820}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, pick: -1 }; }
renderVals() {
const S = [{"label": "Propellers: one blade has a small crack near the hub.", "q": "Fly, or not?", "opts": ["Fly: the crack is small", "Do not fly until it is replaced"], "a": 1, "why": "A cracked or chipped propeller can fail in flight. The aircraft is not in a condition for safe operation.", "v": {"oProp": 1, "oBatt": 0, "oCtl": 0, "oLight": 0, "oCam": 0, "tag": "Check 1 of 5: propellers"}}, {"label": "Battery: 80% charge, but the case is slightly swollen.", "q": "Fly, or not?", "opts": ["Fly: the charge is enough", "Do not fly: take it out of service"], "a": 1, "why": "Swelling means the battery is damaged. The charge level does not change that.", "v": {"oProp": 0, "oBatt": 1, "oCtl": 0, "oLight": 0, "oCam": 0, "tag": "Check 2 of 5: battery"}}, {"label": "Controller: linked, sticks respond correctly, lost-link setting checked.", "q": "Is this part of the preflight?", "opts": ["Yes: the control link must be checked", "No: only the aircraft is inspected"], "a": 0, "why": "The preflight must confirm that the control link between the control station and the aircraft is working properly.", "v": {"oProp": 0, "oBatt": 0, "oCtl": 1, "oLight": 0, "oCam": 0, "tag": "Check 3 of 5: control station"}}, {"label": "Night flight: the anti-collision light works, but its own battery is nearly empty.", "q": "Fly, or not?", "opts": ["Fly: it is on now", "Do not fly until it will last the flight"], "a": 1, "why": "At night the light must stay lit and visible for 3 statute miles for the whole flight. It may be dimmed for safety, never switched off.", "v": {"oProp": 0, "oBatt": 0, "oCtl": 0, "oLight": 1, "oCam": 0, "tag": "Check 4 of 5: anti-collision light"}}, {"label": "A camera has been fitted on a new mount.", "q": "What must you confirm?", "opts": ["It is secure and does not change how the drone flies", "Nothing: add-ons are not part of preflight"], "a": 0, "why": "Anything attached must be secure and must not adversely affect flight characteristics or controllability.", "v": {"oProp": 0, "oBatt": 0, "oCtl": 0, "oLight": 0, "oCam": 1, "tag": "Check 5 of 5: attached equipment"}}];
const n = S.length, i = this.state.i, p = this.state.pick, s = S[i];
const right = p === s.a;
let feedback = "Make your call.", fbBorder = '2px solid #e3e6ea', fbInk = '#0e1114', fbBg = '#f6f8fa';
if (p >= 0 && right) { feedback = 'Correct. ' + s.why; fbBorder = '2px solid #7fbf2e'; fbBg = '#eaf6d8'; }
else if (p >= 0) { feedback = 'Not "' + s.opts[p] + '". ' + s.why; fbBorder = '2px dashed #b42318'; fbInk = '#b42318'; fbBg = '#FFFFFF'; }
return Object.assign({
sceneLabel: s.label, question: s.q, cols: s.opts.length > 3 ? 2 : s.opts.length,
opts: s.opts.map((label, k) => {
const mine = p === k, ok = mine && right;
return { label: label, pressed: mine ? 'true' : 'false',
border: ok ? '2px solid #7fbf2e' : mine ? '2px dashed #b42318' : '2px solid #0e1114',
bg: ok ? '#eaf6d8' : '#FFFFFF', mark: ok ? 'Correct' : mine ? 'Not this' : '', markInk: ok ? '#33590a' : '#b42318',
pick: () => this.setState({ pick: k }) };
}),
feedback: feedback, fbBorder: fbBorder, fbInk: fbInk, fbBg: fbBg,
caption: "Walk around the aircraft, the battery, and the controller. Each stop has one thing to decide.",
progress: 'Check ' + (i + 1) + ' of ' + n,
nextLabel: i === n - 1 ? 'Start over' : 'Next',
nextOne: () => this.setState({ i: (i + 1) % n, pick: -1 }),
back: () => this.setState({ i: Math.max(0, i - 1), pick: -1 })
}, s.v);
}
}
</script>
</body>
</html>
