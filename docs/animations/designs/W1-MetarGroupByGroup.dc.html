<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>METAR, loop player</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0e1114}a:hover{color:#000}

@keyframes bprop{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0.12)}}
.pblade{transform-box:fill-box;transform-origin:center;animation:bprop 0.5s linear infinite}
.pdisc{opacity:0;transition:opacity 0.25s ease}
.fly .pblade{animation-duration:0.1s}
.fly .pdisc{opacity:0.65}
@media (prefers-reduced-motion: reduce){.pblade{animation:none}}

</style>
</helmet>
<div style="width: 720px; height: 820px; box-sizing: border-box; padding: 24px; background: #f6f8fa; color: #0e1114; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600">METAR, group by group</h1>
<span style="font-size: 13px; padding: 6px 12px; border-radius: 8px; background: #2b2f33; color: #a9cfe3; font-weight: 600">Weather</span>
</div>
<div style="position: relative; width: 672px; height: 420px; background: #e7f2f8; border: 1px solid #e3e6ea; border-radius: 12px; overflow: hidden">
<div style="position: absolute; left: 14px; top: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="9"><span style="font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 5px 6px; border-radius: 8px; border: {{g.border}}; background: {{g.bg}}; color: #0e1114; transition: background 0.4s ease">{{g.code}}</span></sc-for>
</div>
<div aria-live="polite" style="position: absolute; left: 14px; top: 54px; right: 14px; font-size: 15px; font-weight: 600; min-height: 22px">{{decode}}</div>
<svg aria-hidden="true" width="672" height="420" viewBox="0 0 672 420" fill="none" style="position: absolute; left: 0; top: 0">
<rect x="0" y="364" width="672" height="56" fill="#e3e6ea"></rect><path d="M0 364h672" stroke="#0e1114" stroke-width="2"></path>
<path d="M60 364V104" stroke="#0e1114" stroke-width="2"></path>
<text x="14" y="98" font-size="12" font-weight="600" fill="#0e1114" text-anchor="start" style="">ft AGL</text>
<path d="M50 340h12M50 214h12M50 124h12" stroke="#0e1114" stroke-width="1.5"></path>
<text x="14" y="344" font-size="12" font-weight="400" fill="#0e1114" text-anchor="start" style="">400</text><text x="8" y="218" font-size="12" font-weight="400" fill="#0e1114" text-anchor="start" style="">2,500</text><text x="8" y="128" font-size="12" font-weight="400" fill="#0e1114" text-anchor="start" style="">4,000</text>
<path d="M62 340h596" stroke="#4f7d14" stroke-width="1.5" stroke-dasharray="5 5"></path><text x="652" y="356" font-size="12" font-weight="600" fill="#33590a" text-anchor="end" style="">Drone limit: 400 ft AGL</text>
<g style="opacity: {{oWind}}; transition: opacity 0.6s ease, transform 0.8s ease"><path d="M120 364V286" stroke="#0e1114" stroke-width="3"></path><path d="M120 288L176 294L176 308L120 306Z" fill="#b42318" stroke="#0e1114" stroke-width="1.5"></path><path d="M138 290v17M156 292v15" stroke="#FFFFFF" stroke-width="5"></path>
<path d="M300 300H210M222 292l-12 8 12 8" stroke="#0e1114" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><text x="206" y="284" font-size="12" font-weight="600" fill="#0e1114" text-anchor="start" style="">Wind from the east, 8 kt</text></g>
<g style="opacity: {{oVis}}; transition: opacity 0.6s ease, transform 0.8s ease"><path d="M400 312h240M400 304v16M640 304v16" stroke="#0e1114" stroke-width="2"></path><text x="520" y="302" font-size="12" font-weight="600" fill="#0e1114" text-anchor="middle" style="">Visibility 10 SM</text>
<path d="M448 252l-5 14M478 244l-5 14M508 256l-5 14M538 246l-5 14M568 254l-5 14" stroke="#6fa6c6" stroke-width="2.5" stroke-linecap="round"></path><text x="640" y="264" font-size="12" font-weight="600" fill="#0e1114" text-anchor="end" style="">Light rain</text></g>
<g style="opacity: {{oSky}}; transition: opacity 0.6s ease, transform 0.8s ease"><rect x="110" y="197" width="110" height="34" rx="17" fill="#FFFFFF" stroke="#0e1114" stroke-width="2"></rect><rect x="330" y="197" width="90" height="34" rx="17" fill="#FFFFFF" stroke="#0e1114" stroke-width="2"></rect><text x="232" y="218" font-size="12" font-weight="600" fill="#0e1114" text-anchor="start" style="">SCT 2,500 ft</text>
<rect x="100" y="106" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#0e1114" stroke-width="2"></rect><rect x="270" y="106" width="170" height="36" rx="18" fill="#FFFFFF" stroke="#0e1114" stroke-width="2"></rect><text x="452" y="128" font-size="12" font-weight="600" fill="#0e1114" text-anchor="start" style="">BKN 4,000 ft: the ceiling</text></g>
<g style="opacity: {{oTemp}}; transition: opacity 0.6s ease, transform 0.8s ease"><rect x="596" y="160" width="62" height="60" rx="8" fill="#FFFFFF" stroke="#0e1114" stroke-width="2"></rect><text x="627" y="182" font-size="14" font-weight="600" fill="#0e1114" text-anchor="middle" style="">18°C</text><text x="627" y="198" font-size="11" font-weight="400" fill="#0e1114" text-anchor="middle" style="">dew 14°C</text><text x="627" y="213" font-size="11" font-weight="400" fill="#0e1114" text-anchor="middle" style="">29.90 in</text></g>
</svg>
<div style="position: absolute; left: 76px; bottom: 64px; display: flex; opacity: {{oOk}}; transition: opacity 0.6s ease, transform 0.8s ease"><sc-if value="{{always}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #9cd94a; color: #0e1114; font-size: 14px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0e1114" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"></path></svg><span>Within Part 107 weather limits</span></div>
</sc-if></div>
</div>
<p aria-live="polite" style="margin: 0; font-size: 15px; line-height: 1.4; min-height: 42px">{{caption}}</p>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Play or pause" onClick="{{toggle}}" style="width: 44px; height: 44px; border-radius: 999px; border: 2px solid #9cd94a; background: #9cd94a; cursor: pointer; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isPlaying}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="#0e1114"><rect x="3" y="2" width="3.5" height="12"></rect><rect x="9.5" y="2" width="3.5" height="12"></rect></svg></sc-if>
<sc-if value="{{isPaused}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="#0e1114"><path d="M4 2l10 6-10 6z"></path></svg></sc-if>
</button>
<button type="button" onClick="{{replay}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; border: 2px solid #0e1114; background: #FFFFFF; color: #0e1114">Replay</button>
<button type="button" onClick="{{prev}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; border: 2px solid #0e1114; background: #FFFFFF; color: #0e1114">Back</button>
<button type="button" onClick="{{next}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; border: 2px solid #0e1114; background: #FFFFFF; color: #0e1114">Next</button>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; margin-left: 8px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span style="height: 10px; border-radius: 5px; width: {{d.w}}; background: {{d.bg}}; transition: width 0.3s ease"></span></sc-for>
</div>
<span style="margin-left: auto; font-size: 13px; font-variant-numeric: tabular-nums">{{beatLabel}}</span>
</div>
<div style="margin-top: auto; padding: 14px 16px; background: #0e1114; color: #ffffff; border-radius: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35">Time is Zulu. Wind is in knots. Visibility is in statute miles. Cloud heights are feet AGL.</p>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #2b2f33; color: #a9cfe3; white-space: nowrap; font-variant-numeric: tabular-nums">FAA weather handbook</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="48" height="52" viewBox="0 0 48 52" fill="none" style="flex-shrink: 0">
<path d="M5 52C5 45 13 41.5 24 41.5C35 41.5 43 45 43 52Z" fill="#a9cfe3"></path>
<path d="M19 41.5L24 47L29 41.5" stroke="#6fa6c6" stroke-width="1.5" stroke-linejoin="round"></path>
<rect x="29" y="45.5" width="9" height="4.5" rx="1.5" fill="#9cd94a"></rect>
<rect x="20" y="33" width="8" height="9" fill="#dcbf98"></rect>
<path d="M12 14Q12 6 24 6Q36 6 36 14L36 26Q36 31 31.5 34.5L27.5 37.5Q24 39.5 20.5 37.5L16.5 34.5Q12 31 12 26Z" fill="#f0d6b4"></path>
<path d="M10.5 17Q9.5 3 24 3Q38.5 3 37.5 17L35 13.5Q24 9.5 13 13.5Z" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8" stroke-linejoin="round"></path>
<rect x="7" y="15" width="5.5" height="11.5" rx="2" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8"></rect>
<rect x="35.5" y="15" width="5.5" height="11.5" rx="2" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8"></rect>
<path d="M12.5 16L35.5 16L34.5 23Q30 25.8 26 22.6L24 21.6L22 22.6Q18 25.8 13.5 23Z" fill="#6fa6c6" stroke="#2b2f33" stroke-width="0.8" stroke-linejoin="round"></path>
<path d="M15 18L21.5 18" stroke="#e7f2f8" stroke-width="1.1" stroke-linecap="round"></path>
<path d="M27.5 19.5h5" stroke="#9cd94a" stroke-width="1.1" stroke-linecap="round"></path>
<path d="M20.5 30.5Q24 32.6 27.5 30.5" stroke="#2b2f33" stroke-width="1.4" stroke-linecap="round"></path>
<path d="M9.5 26Q10.5 33.5 18.5 34" stroke="#8a9198" stroke-width="1.5" stroke-linecap="round"></path>
<circle cx="19.5" cy="34" r="1.7" fill="#9cd94a"></circle>
</svg>
<p style="margin: 0; padding: 8px 12px; background: #eaf6d8; border: 2px solid #9cd94a; border-radius: 13px; color: #2b2f33; font-size: 13px; line-height: 1.5">BR is mist. Fog is FG.</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":820}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
this.state = { beat: reduce ? 6 : 1, playing: !reduce };
}
componentDidMount() {
this.timer = setInterval(() => {
if (!this.state.playing) return;
if (this.state.beat >= 6) { this.setState({ playing: false }); return; }
this.setState({ beat: this.state.beat + 1 });
}, 2600);
}
componentWillUnmount() { clearInterval(this.timer); }
loopVals() {
const beat = this.state.beat;
const playing = this.state.playing;
return {
isPlaying: playing,
isPaused: !playing,
beatLabel: 'Beat ' + beat + ' of 6',
dots: [1, 2, 3, 4, 5, 6].map((n) => ({ bg: n <= beat ? '#0e1114' : '#c3c9d0', w: n === beat ? '22px' : '10px' })),
toggle: () => { if (!playing && beat >= 6) this.setState({ beat: 1, playing: true }); else this.setState({ playing: !playing }); },
replay: () => this.setState({ beat: 1, playing: true }),
prev: () => this.setState({ beat: Math.max(1, beat - 1), playing: false }),
next: () => this.setState({ beat: Math.min(6, beat + 1), playing: false })
};
}

renderVals() {
const beat = this.state.beat;
const captions = ["KMCO 121853Z: Orlando International, the 12th day of the month, 1853 Zulu. Zulu is UTC, not local time.", "09008KT: wind from 090 degrees, which is east, at 8 knots.", "10SM -RA: visibility 10 statute miles in light rain. The minus sign means light.", "SCT025 BKN040: scattered cloud at 2,500 ft and broken cloud at 4,000 ft, both AGL. The lowest broken or overcast layer is the ceiling.", "18/14 A2990: temperature 18°C, dew point 14°C, altimeter 29.90 inches of mercury.", "For Part 107: 10 SM beats the 3 SM minimum, and a 4,000 ft ceiling leaves far more than 500 ft above a drone at 400 ft."];
return Object.assign(this.loopVals(), {
caption: captions[beat - 1],
always: true,
decode: ['Where and when', 'Wind', 'Visibility and weather', 'Sky condition', 'Temperature, dew point, altimeter', 'The whole report'][beat - 1],
groups: [['KMCO', 1], ['121853Z', 1], ['09008KT', 2], ['10SM', 3], ['-RA', 3], ['SCT025', 4], ['BKN040', 4], ['18/14', 5], ['A2990', 5]].map((g) => ({ code: g[0], bg: g[1] === beat ? '#9cd94a' : g[1] < beat ? '#eaf6d8' : '#FFFFFF', border: g[1] === beat ? '2px solid #0e1114' : '2px solid #e3e6ea' })),
oWind: beat >= 2 ? 1 : 0, oVis: beat >= 3 ? 1 : 0, oSky: beat >= 4 ? 1 : 0, oTemp: beat >= 5 ? 1 : 0, oOk: beat >= 6 ? 1 : 0
});
}
}
</script>
</body>
</html>
