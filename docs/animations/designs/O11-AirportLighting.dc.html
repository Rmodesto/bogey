<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Airport lighting, loop player</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0e1114}a:hover{color:#000}

@keyframes bprop{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0.12)}}
.pblade{transform-box:fill-box;transform-origin:center;animation:bprop 0.5s linear infinite}
.pdisc{opacity:0;transition:opacity 0.25s ease}
.fly .pblade{animation-duration:0.1s}
.fly .pdisc{opacity:0.65}
@media (prefers-reduced-motion: reduce){.pblade{animation:none}}

</style>
</helmet>
<div style="width: 720px; height: 820px; box-sizing: border-box; padding: 24px; background: #f6f8fa; color: #0e1114; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Airport lighting</h1>
<span style="font-size: 13px; padding: 6px 12px; border-radius: 8px; background: #2b2f33; color: #a9cfe3; font-weight: 600">Operations</span>
</div>
<div style="position: relative; width: 672px; height: 420px; background: #0e1114; border: 1px solid #e3e6ea; border-radius: 12px; overflow: hidden">
<svg aria-hidden="true" width="672" height="420" viewBox="0 0 672 420" fill="none" style="position: absolute; left: 0; top: 0">
<circle cx="30" cy="20" r="1" fill="#8a9198"></circle><circle cx="140" cy="34" r="1" fill="#8a9198"></circle><circle cx="250" cy="14" r="1" fill="#8a9198"></circle><circle cx="620" cy="24" r="1" fill="#8a9198"></circle><circle cx="560" cy="60" r="1" fill="#8a9198"></circle><circle cx="600" cy="150" r="1" fill="#8a9198"></circle>
<text x="40" y="30" font-size="12" font-weight="600" fill="#a9cfe3" text-anchor="start" style="">Rotating beacon</text><text x="300" y="30" font-size="12" font-weight="600" fill="#a9cfe3" text-anchor="middle" style="">What you see, in order</text>
<g style="opacity: {{o1}}; transition: opacity 0.6s ease, transform 0.8s ease"><text x="40" y="67" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" style="">Civilian land airport</text><circle cx="300" cy="62" r="13" fill="#FFFFFF" opacity="0.3"></circle><circle cx="300" cy="62" r="8" fill="#FFFFFF"></circle><text x="300" y="92" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">White</text><circle cx="376" cy="62" r="13" fill="#30a46c" opacity="0.3"></circle><circle cx="376" cy="62" r="8" fill="#30a46c"></circle><text x="376" y="92" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">Green</text></g>
<g style="opacity: {{o2}}; transition: opacity 0.6s ease, transform 0.8s ease"><text x="40" y="127" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" style="">Military airport</text><circle cx="300" cy="122" r="13" fill="#FFFFFF" opacity="0.3"></circle><circle cx="300" cy="122" r="8" fill="#FFFFFF"></circle><text x="300" y="152" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">White</text><circle cx="376" cy="122" r="13" fill="#FFFFFF" opacity="0.3"></circle><circle cx="376" cy="122" r="8" fill="#FFFFFF"></circle><text x="376" y="152" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">White</text><circle cx="452" cy="122" r="13" fill="#30a46c" opacity="0.3"></circle><circle cx="452" cy="122" r="8" fill="#30a46c"></circle><text x="452" y="152" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">Green</text></g>
<g style="opacity: {{o3}}; transition: opacity 0.6s ease, transform 0.8s ease"><text x="40" y="187" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" style="">Heliport</text><circle cx="300" cy="182" r="13" fill="#30a46c" opacity="0.3"></circle><circle cx="300" cy="182" r="8" fill="#30a46c"></circle><text x="300" y="212" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">Green</text><circle cx="376" cy="182" r="13" fill="#f5d90a" opacity="0.3"></circle><circle cx="376" cy="182" r="8" fill="#f5d90a"></circle><text x="376" y="212" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">Yellow</text><circle cx="452" cy="182" r="13" fill="#FFFFFF" opacity="0.3"></circle><circle cx="452" cy="182" r="8" fill="#FFFFFF"></circle><text x="452" y="212" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">White</text></g>
<g style="opacity: {{o4}}; transition: opacity 0.6s ease, transform 0.8s ease"><text x="40" y="247" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" style="">Seaplane base</text><circle cx="300" cy="242" r="13" fill="#FFFFFF" opacity="0.3"></circle><circle cx="300" cy="242" r="8" fill="#FFFFFF"></circle><text x="300" y="272" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">White</text><circle cx="376" cy="242" r="13" fill="#f5d90a" opacity="0.3"></circle><circle cx="376" cy="242" r="8" fill="#f5d90a"></circle><text x="376" y="272" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">Yellow</text></g>
<g style="opacity: {{o5}}; transition: opacity 0.6s ease, transform 0.8s ease"><path d="M60 300L612 300L640 400L32 400Z" fill="#2b2f33"></path><path d="M336 310V396" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 10"></path>
<circle cx="60" cy="300" r="4" fill="#FFFFFF"></circle><circle cx="612" cy="300" r="4" fill="#FFFFFF"></circle><circle cx="54" cy="320" r="4" fill="#FFFFFF"></circle><circle cx="618" cy="320" r="4" fill="#FFFFFF"></circle><circle cx="49" cy="340" r="4" fill="#FFFFFF"></circle><circle cx="623" cy="340" r="4" fill="#FFFFFF"></circle><circle cx="43" cy="360" r="4" fill="#FFFFFF"></circle><circle cx="629" cy="360" r="4" fill="#FFFFFF"></circle><circle cx="38" cy="380" r="4" fill="#FFFFFF"></circle><circle cx="634" cy="380" r="4" fill="#FFFFFF"></circle><circle cx="32" cy="400" r="4" fill="#FFFFFF"></circle><circle cx="640" cy="400" r="4" fill="#FFFFFF"></circle>
<text x="336" y="290" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">Runway edge lights: white</text>
<circle cx="588" cy="284" r="4" fill="#3b82f6"></circle><circle cx="616" cy="284" r="4" fill="#3b82f6"></circle><text x="574" y="288" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="end" style="">Taxiway edge: blue</text></g>
</svg>
</div>
<p aria-live="polite" style="margin: 0; font-size: 15px; line-height: 1.4; min-height: 42px">{{caption}}</p>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Play or pause" onClick="{{toggle}}" style="width: 44px; height: 44px; border-radius: 999px; border: 2px solid #9cd94a; background: #9cd94a; cursor: pointer; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isPlaying}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="#0e1114"><rect x="3" y="2" width="3.5" height="12"></rect><rect x="9.5" y="2" width="3.5" height="12"></rect></svg></sc-if>
<sc-if value="{{isPaused}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="#0e1114"><path d="M4 2l10 6-10 6z"></path></svg></sc-if>
</button>
<button type="button" onClick="{{replay}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; border: 2px solid #0e1114; background: #FFFFFF; color: #0e1114">Replay</button>
<button type="button" onClick="{{prev}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; border: 2px solid #0e1114; background: #FFFFFF; color: #0e1114">Back</button>
<button type="button" onClick="{{next}}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; border-radius: 999px; cursor: pointer; border: 2px solid #0e1114; background: #FFFFFF; color: #0e1114">Next</button>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; margin-left: 8px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span style="height: 10px; border-radius: 5px; width: {{d.w}}; background: {{d.bg}}; transition: width 0.3s ease"></span></sc-for>
</div>
<span style="margin-left: auto; font-size: 13px; font-variant-numeric: tabular-nums">{{beatLabel}}</span>
</div>
<div style="margin-top: auto; padding: 14px 16px; background: #0e1114; color: #ffffff; border-radius: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35">White and green: civilian airport. Two whites and a green: military.</p>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #2b2f33; color: #a9cfe3; white-space: nowrap; font-variant-numeric: tabular-nums">FAA airport procedures</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="48" height="52" viewBox="0 0 48 52" fill="none" style="flex-shrink: 0">
<path d="M5 52C5 45 13 41.5 24 41.5C35 41.5 43 45 43 52Z" fill="#a9cfe3"></path>
<path d="M19 41.5L24 47L29 41.5" stroke="#6fa6c6" stroke-width="1.5" stroke-linejoin="round"></path>
<rect x="29" y="45.5" width="9" height="4.5" rx="1.5" fill="#9cd94a"></rect>
<rect x="20" y="33" width="8" height="9" fill="#dcbf98"></rect>
<path d="M12 14Q12 6 24 6Q36 6 36 14L36 26Q36 31 31.5 34.5L27.5 37.5Q24 39.5 20.5 37.5L16.5 34.5Q12 31 12 26Z" fill="#f0d6b4"></path>
<path d="M10.5 17Q9.5 3 24 3Q38.5 3 37.5 17L35 13.5Q24 9.5 13 13.5Z" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8" stroke-linejoin="round"></path>
<rect x="7" y="15" width="5.5" height="11.5" rx="2" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8"></rect>
<rect x="35.5" y="15" width="5.5" height="11.5" rx="2" fill="#2b2f33" stroke="#8a9198" stroke-width="0.8"></rect>
<path d="M12.5 16L35.5 16L34.5 23Q30 25.8 26 22.6L24 21.6L22 22.6Q18 25.8 13.5 23Z" fill="#6fa6c6" stroke="#2b2f33" stroke-width="0.8" stroke-linejoin="round"></path>
<path d="M15 18L21.5 18" stroke="#e7f2f8" stroke-width="1.1" stroke-linecap="round"></path>
<path d="M27.5 19.5h5" stroke="#9cd94a" stroke-width="1.1" stroke-linecap="round"></path>
<path d="M20.5 30.5Q24 32.6 27.5 30.5" stroke="#2b2f33" stroke-width="1.4" stroke-linecap="round"></path>
<path d="M9.5 26Q10.5 33.5 18.5 34" stroke="#8a9198" stroke-width="1.5" stroke-linecap="round"></path>
<circle cx="19.5" cy="34" r="1.7" fill="#9cd94a"></circle>
</svg>
<p style="margin: 0; padding: 8px 12px; background: #eaf6d8; border: 2px solid #9cd94a; border-radius: 13px; color: #2b2f33; font-size: 13px; line-height: 1.5">Two quick whites means military. Give it room.</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":820}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
this.state = { beat: reduce ? 6 : 1, playing: !reduce };
}
componentDidMount() {
this.timer = setInterval(() => {
if (!this.state.playing) return;
if (this.state.beat >= 6) { this.setState({ playing: false }); return; }
this.setState({ beat: this.state.beat + 1 });
}, 2600);
}
componentWillUnmount() { clearInterval(this.timer); }
loopVals() {
const beat = this.state.beat;
const playing = this.state.playing;
return {
isPlaying: playing,
isPaused: !playing,
beatLabel: 'Beat ' + beat + ' of 6',
dots: [1, 2, 3, 4, 5, 6].map((n) => ({ bg: n <= beat ? '#0e1114' : '#c3c9d0', w: n === beat ? '22px' : '10px' })),
toggle: () => { if (!playing && beat >= 6) this.setState({ beat: 1, playing: true }); else this.setState({ playing: !playing }); },
replay: () => this.setState({ beat: 1, playing: true }),
prev: () => this.setState({ beat: Math.max(1, beat - 1), playing: false }),
next: () => this.setState({ beat: Math.min(6, beat + 1), playing: false })
};
}

renderVals() {
const beat = this.state.beat;
const captions = ["A civilian land airport: the beacon alternates white and green.", "A military airport: two quick white flashes, then green.", "A heliport: green, yellow, and white.", "A lighted seaplane base: white and yellow.", "On the ground, runway edge lights are white and taxiway edge lights are blue.", "Each color is named on screen, here and on the test. Learn the patterns as words: white-green, white-white-green."];
return Object.assign(this.loopVals(), {
caption: captions[beat - 1],
o1: beat >= 1 ? 1 : 0, o2: beat >= 2 ? 1 : 0, o3: beat >= 3 ? 1 : 0, o4: beat >= 4 ? 1 : 0, o5: beat >= 5 ? 1 : 0
});
}
}
</script>
</body>
</html>
