<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":820}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { x: 18, y: 12 }; }
renderVals() {
const x = this.state.x, y = this.state.y;
const pad = (n) => (n < 10 ? '0' : '') + n;
const lonTotal = 98 * 60 - x, lonD = Math.floor(lonTotal / 60), lonM = lonTotal % 60;
const lat = '35°' + pad(y) + '′ N', lon = lonD + '°' + pad(lonM) + '′ W';
const fromLine = x <= 30 ? x + ' minutes east of the 98° line' : (x - 30) + ' minutes east of the 97°30′ line';
return {
x: x, y: y, xText: 'longitude ' + lonD + ' degrees ' + lonM + ' minutes west', yText: 'latitude 35 degrees ' + y + ' minutes north',
lat: lat, lon: lon, readout: lat + ', ' + lon,
cx: (100 + x * 10) + 'px', cy: (350 - y * 10) + 'px',
caption: 'Latitude: ' + y + ' ticks north of the 35° line, so ' + lat + '. Longitude: ' + fromLine + ', and going east the number goes down, so ' + lon + '.',
onX: (e) => this.setState({ x: Number(e.target.value) }),
onY: (e) => this.setState({ y: Number(e.target.value) })
};
}
}
</script>
